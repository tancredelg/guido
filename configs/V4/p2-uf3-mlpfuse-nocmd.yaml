# Phase 2 — trajectory + depth + segmentation auxiliary tasks.
# Run: uv run src/train_v4.py --config configs/V4/phase2.yaml
#
# Images resized to 192×304 (nearest multiples of 16 to native 200×300)
# giving patch grid 12×19 = 228 tokens, preserving aspect ratio.

wandb_entity:   tancredelg-personal
wandb_project:  dlav-guido-V4
wandb_run_name: p2-uf3-mlpfuse-nocmd

data_dir:       data
checkpoint_dir: checkpoints
dino_model:     dinov3_vitb16
dino_repo_dir:  /scratch/toumieh/tanc/dinov3
dino_weights:   /scratch/toumieh/tanc/dinov3/weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth

seed: 42
batch_size: 32
num_workers: 4
weighted_sampler: false
mirror_p: 0.15
hist_noise_std: 0.01
hist_dropout_p: 0.1
mirror_warmup: 5

# Architecture
unfreeze_blocks: 3
use_cmd: false
scene_fusion: none
d: 384
num_heads: 4
rope_base: 10000.0
hist_layers: 2
dec_layers: 2
K: 1
n_coarse: 5
dropout: 0.05

# Auxiliary heads
img_h: 200
img_w: 300
use_depth_aux: true
use_seg_aux: true
num_seg_classes: 14
seg_ignore_index: 255
aux_d_dec: 128
lambda_depth: 0.15
lambda_seg: 0.5
aux_warmup_epochs: 10

# Trajectory loss
loss_weighting: linear
loss_near_weight: 0.5
loss_far_weight: 2.5
smoothness_weight: 0.05
coarse_weight: 0.25
fde_weight: 0.0
stationary_weight: 0.0
wta_weight: 1.0
router_weight: 0.0
router_warmup_epochs: 0

# Optimisation
num_epochs: 400
warmup_epochs: 20
lr: 1.0e-4
backbone_lr: 5.0e-6
aux_lr: 2.0e-4
weight_decay: 1.5e-3
grad_clip: 1.0
min_lr: 5.0e-7
log_interval: 20