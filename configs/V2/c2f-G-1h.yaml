# V2 Coarse-to-Fine — single head (no routing)
# Coarse head provides auxiliary gradient signal at anchor waypoints.
# This alone may improve the single-head baseline.

wandb_entity:   tancredelg-personal
wandb_project:  dlav-guido
wandb_run_name: v2-c2f-G-1h

data_dir:       data
checkpoint_dir: checkpoints
dino_model:     dinov3_vitb16
dino_repo_dir:  /scratch/toumieh/tanc/dinov3
dino_weights:   /scratch/toumieh/tanc/dinov3/weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth

seed: 42
batch_size:       64
num_workers:      4

weighted_sampler: false
mirror_p:         0.1
hist_noise_std:   0.02
mirror_warmup:    5

unfreeze_blocks:  1
d:                512
num_heads:        8
hist_layers:      4
dec_layers:       4
K:                1
n_coarse:         6
dropout:          0.05
cmd_embed_dim:    256

loss_near_weight:  0.5
loss_far_weight:   2.5
smoothness_weight: 0.1
coarse_weight:     0.35
wta_weight:        1.0
router_weight:     0.0
router_warmup_epochs: 0

num_epochs:    400
warmup_epochs: 10

lr:            2.0e-4
backbone_lr:   1.0e-5
weight_decay:  1.0e-3
grad_clip:     1.0
min_lr:        2.0e-5
log_interval:  20