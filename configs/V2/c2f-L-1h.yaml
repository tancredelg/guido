# V2 Coarse-to-Fine — single head (no routing)
# Coarse head provides auxiliary gradient signal at anchor waypoints.
# This alone may improve the single-head baseline.

wandb_entity:   tancredelg-personal
wandb_project:  dlav-guido
wandb_run_name: v2-384D/4-2L-1h

data_dir:       /scratch/toumieh/tanc/guido/data
checkpoint_dir: checkpoints
dino_model:     dinov3_vitb16
dino_repo_dir:  /scratch/toumieh/tanc/dinov3
dino_weights:   /scratch/toumieh/tanc/dinov3/weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth

seed: 42
batch_size:       32
num_workers:      4
weighted_sampler: false
mirror_p:         0.1
hist_noise_std:   0.01
mirror_warmup:    5

# === Architecture
unfreeze_blocks: 1
cmd_embed_dim:   128
d:               384
num_heads:       4
hist_layers:     2
dec_layers:      2
K:               1
n_coarse:        5
dropout:         0.05

# === Loss
loss_near_weight:     0.6
loss_far_weight:      2.2
smoothness_weight:    0.08
coarse_weight:        0.3
wta_weight:           1.0
router_weight:        0.0
router_warmup_epochs: 0

# === Optimisation
num_epochs:    350
warmup_epochs: 10
lr:            1.0e-4
backbone_lr:   1.0e-5
weight_decay:  5.0e-4
grad_clip:     1.0
min_lr:        1.0e-6
log_interval:  20