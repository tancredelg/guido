# Phase 3 — sim-to-real generalisation via mixed data fine-tuning.
# Warm-starts from Phase 2 best checkpoint, trains on synthetic + real data.
# Run: uv run src/train_v5.py --config configs/V5/phase3.yaml

wandb_entity:   tancredelg-personal
wandb_project:  dlav-guido-V5
wandb_run_name: p3-mixed-finetune

data_dir:       data
checkpoint_dir: checkpoints
dino_model:     dinov3_vitb16
dino_repo_dir:  /scratch/toumieh/tanc/dinov3
dino_weights:   /scratch/toumieh/tanc/dinov3/weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth

# Start from Phase 2 best (ADE ~1.47 synthetic) — skips ~200 epochs of warmup
warm_start: checkpoints/run_20260514_2015_epoch249_ade1.4764.pth

seed: 42
batch_size: 32
num_workers: 4

# Mixed data setup
use_real_data: true
real_train_frac: 0.95      # 95% of val_real for training, 5% for validation

# Stronger augmentation to close sim-to-real domain gap
mirror_p: 0.4
hist_noise_std: 0.01
hist_dropout_p: 0.1
mirror_warmup: 5
weighted_sampler: false

# Architecture (must match warm_start checkpoint)
unfreeze_blocks: 2
use_cmd: false
scene_fusion: rope_xattn
d: 384
num_heads: 4
rope_base: 10000.0
hist_layers: 2
dec_layers: 4
causal_decoder: true
K: 1
n_coarse: 6
dropout: 0.05

# Aux tasks OFF for Phase 3 (no depth/seg labels in real data)
use_depth_aux: false
use_seg_aux: false
use_normals_aux: false

# Trajectory loss
loss_weighting: linear
loss_near_weight: 0.5
loss_far_weight: 5.0
smoothness_weight: 0.05
coarse_weight: 0.3
wta_weight: 1.0
router_weight: 0.0
router_warmup_epochs: 0

# Optimisation — lower lr since we're fine-tuning
num_epochs: 300
warmup_epochs: 5
lr_restart_epochs: 300
lr: 1.0e-4             # lower than phase 2 — fine-tuning regime
backbone_lr: 7.0e-5
weight_decay: 1.0e-3
grad_clip: 1.0
min_lr: 7.0e-7
log_interval: 50