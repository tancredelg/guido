# Phase 3 — train from scratch on mixed synthetic + real data.
# NO warm_start — the Phase 2 checkpoint was trained on a different
# coordinate scale (synthetic: ~0.01m, real: ~16m) so it can't transfer.
# DINOv3 backbone already pretrained on real images → visual features transfer.
# Run: uv run src/train_v5.py --config configs/V5/phase3_scratch.yaml

wandb_entity:   tancredelg-personal
wandb_project:  dlav-guido-V5
wandb_run_name: p3-scratch-mixed

data_dir:       data
checkpoint_dir: checkpoints
dino_model:     dinov3_vitb16
dino_repo_dir:  /scratch/toumieh/tanc/dinov3
dino_weights:   /scratch/toumieh/tanc/dinov3/weights/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth

# No warm_start — train fresh on mixed data

seed: 42
batch_size: 32
num_workers: 4

# Mixed data: all synthetic train + 80% of val_real for training
use_real_data: true
real_train_frac: 0.80
weighted_sampler: false
mirror_p: 0.1
hist_noise_std: 0.005
hist_dropout_p: 0.05
mirror_warmup: 10

# Architecture — keep it simpler than Phase 2 to avoid overfitting on small real dataset
unfreeze_blocks: 2
use_cmd: false
scene_fusion: rope_xattn
d: 384
num_heads: 4
rope_base: 10000.0
hist_layers: 2
dec_layers: 4
causal_decoder: true
K: 1
n_coarse: 6
dropout: 0.08  # higher dropout since dataset is small

# No aux tasks (no depth/seg labels in real data)
use_depth_aux: false
use_seg_aux: false
use_normals_aux: false

# Trajectory loss
loss_weighting: linear
loss_near_weight: 0.5
loss_far_weight: 5.0
smoothness_weight: 0.05
coarse_weight: 0.4
fde_weight: 0.0
stationary_weight: 0.0
wta_weight: 1.0
router_weight: 0.0
router_warmup_epochs: 0

# Optimisation — standard schedule, not fine-tuning regime
num_epochs: 400
warmup_epochs: 5
lr_restart_epochs: 400  # Set to num_epochs for no restarts
lr: 7.0e-5
backbone_lr: 7.0e-6
weight_decay: 1.0e-3
grad_clip: 1.0
min_lr: 7.0e-7
log_interval: 200
vis_every_epochs: 25
